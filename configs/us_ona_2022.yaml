# ============================================================================
# US-ONA (Ontario Peatland) 2022 CONFIGURATION - Forward PINN Training
# ============================================================================
# Site: US-ONA (Ontario Peatland, Ohio)
# Location: Minerotrophic peatland (fen)
# Data source: AmeriFlux BASE product (HH = half-hourly)
# Version: 4-5

# ============================================================================
# DATA CONFIGURATION
# ============================================================================
data:
  path: 'data/AMF_US-ONA_BASE_HH_4-5.csv'
  start_date: '2021-06-21'   # Start of 2022
  end_date: '2021-07-9'     # 2021-09-01
  interpolate: true
  max_gap_hours: 6

  # Column mapping - US-ONA AmeriFlux format
  column_mapping:
    # Datetime column (AmeriFlux format: YYYYMMDDHHMM)
    datetime: 'TIMESTAMP_START'

    # Single-level header
    multi_level_header: false

    # Unit conversion: Data is in percentage (0-100), convert to fraction
    unit_conversion: 0.01

    # Depth column mappings
    # US-ONA has 2 SWC sensors at different depths
    depths:
      10cm: 'SWC_1_1_1'    # Surface BC - shallower sensor (estimated)
      20cm: 'SWC_1_2_1'    # Deeper sensor (estimated)

    # Water table depth
    wtd: 'WTD'
    wtd_sign: -1.0  # Data is negative (below surface), convert to positive downward

# ============================================================================
# SOIL PARAMETERS (van Genuchten-Mualem)
# ============================================================================
# US-ONA is a minerotrophic peatland (fen) with organic soils
# Reference: https://ameriflux.lbl.gov/sites/siteinfo/US-ONA
soil:
  theta_s: 0.65    # Saturated water content [-] (peat)
  theta_r: 0.01    # Residual water content [-] (peat)
  alpha: 0.7       # van Genuchten α [1/m] (peat)
  n: 1.90          # van Genuchten n (>1) [-] (peat)
  Ks: 3.0e-5       # Saturated hydraulic conductivity [m/s] (peat)
  l: 0.5           # Mualem pore-connectivity parameter [-]

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  n_epochs: 10000
  learning_rate: 1.0e-4
  device: 'auto'      # 'auto' (use GPU if available), 'cuda', or 'cpu'
  seed: 42

# ============================================================================
# NETWORK ARCHITECTURE
# ============================================================================
network:
  h_net:              # Pressure head network
    hidden_dim: 64
    num_layers: 4
  zb_net:             # Water table network
    hidden_dim: 32
    num_layers: 3

# ============================================================================
# CACHE POOL & BATCH SAMPLING (PDE Collocation)
# ============================================================================
sampling:
  cache_size: 0           # Total candidate points in pool
  batch_size: 2000             # Points sampled per iteration
  resample_freq: 1000000        # Update residuals every N epochs
  boundary_ratio: 0         # Fraction of cache near boundaries (0-1)
  high_residual_ratio: 0    # Fraction from high-residual regions (0-1)
  temperature: 0.3            # Softmax temperature (lower = more aggressive)

# ============================================================================
# BOUNDARY CONDITION SAMPLING (Gradient-Based)
# ============================================================================
boundary_sampling:
  batch_size_bc: 450          # Dedicated BC points per iteration
  interp_ratio: 0.30          # Fraction from gradient-interpolated points
  neighbor_ratio: 0.00        # Fraction from neighbors of high-gradient regions
  baseline_ratio: 0.70        # Fraction from uniform baseline
  neighbor_expansion: 0       # How many neighbors around high-gradient intervals
  gradient_threshold: 0.7     # Percentile for "high gradient" (0.7 = top 30%)
  power: 2.0                  # Gradient emphasis (>1 = more aggressive)

# ============================================================================
# OPTIMIZATION & WEIGHT MANAGEMENT
# ============================================================================
optimization:
  weight_update_freq: 10000000000  # Update weights every N epochs (1e10 = fixed)
  weight_lr: 0.1                   # Learning rate for weight updates
  use_initial_scales: true         # Use initial scale-based weights
  use_amp: false                   # Mixed precision training (faster, less memory)
  use_multi_gpu: true              # Use DataParallel if multiple GPUs available
  grad_accumulation_steps: 1       # Gradient accumulation for larger effective batch

# ============================================================================
# CHECKPOINTING
# ============================================================================
checkpointing:
  dir: 'checkpoints_train'
  freq: 50000                  # Save checkpoint every N epochs
  keep_last_n: 3              # Keep only last N checkpoints (null = keep all)

# ============================================================================
# PHYSICS PARAMETERS
# ============================================================================
physics:
  Sy: 0.25                    # Specific yield [-] (peat)
  zr: 0.3                     # Root zone depth [m] (fen vegetation)
  L: 3.0                      # Characteristic length [m]
  S_max: 1.5e-7               # Maximum sink term [1/s]
  zb_initial: 1.3             # Initial water table depth [m] (moderate - peatland)
  ic_type: 'obs'              # Initial condition: 'obs', 'linear', 'hydrostatic'

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================
output:
  dir: 'outputs'

# ============================================================================
# NOTES
# ============================================================================
# Site Information:
#   - Location: Ontario Peatland, Ohio (40.5176°N, 83.0172°W)
#   - Elevation: 313 m
#   - Climate: Humid continental
#   - Vegetation: Minerotrophic fen (grasses, sedges, shrubs)
#   - Soil: Organic peat soils
#
# Data Notes:
#   - AmeriFlux BASE product
#   - SWC_1_1_1: 96.4% coverage in 2022
#   - SWC_1_2_1: 95.9% coverage in 2022
#   - WTD data: 99.1% coverage in 2022 (excellent!)
#   - Missing values coded as -9999
#   - Wide moisture range (0-40%) due to peatland water table fluctuations
#   - WTD is negative (below surface)
#   - Average water table depth ~1.3 m
#
# Recommended Actions:
#   1. Verify actual SWC sensor depths from site documentation
#   2. Consider peatland-specific hydraulic properties
#   3. Update soil parameters if site measurements available
#   4. Account for unique fen ecosystem processes
#
# References:
#   - AmeriFlux site info: https://ameriflux.lbl.gov/sites/siteinfo/US-ONA
