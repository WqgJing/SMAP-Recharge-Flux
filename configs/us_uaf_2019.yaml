# ============================================================================
# US-UAF 2019 CONFIGURATION - Forward PINN Training
# ============================================================================
# This config demonstrates how to use the column mapping feature for different
# data formats. The US-Uaf data has different column names and units compared
# to the Calhoun CCZO data.

# ============================================================================
# DATA CONFIGURATION
# ============================================================================
data:
  path: 'data/US-Uaf_2019_May-Sep_LE_SWC_WTD.xlsx'
  start_date: '2019-07-30'  # July 30, 2019
  end_date: '2019-08-13'    # August 13, 2019 (15 days)
  interpolate: true
  max_gap_hours: 6

  # Column mapping - US-Uaf specific columns
  # SWC_1_2_1 is used as the SURFACE boundary condition
  column_mapping:
    # Datetime column name (single-level header)
    datetime: 'datetime'

    # Multi-level header indicator
    multi_level_header: false

    # Unit conversion factor (0.01 to convert percentage to fraction)
    unit_conversion: 0.01

    # Depth column mappings (depth_name: column_name)
    # Using RAW data (not gap-filled) as specified
    # SWC_1_2_1 is the SURFACE BC (first depth in the list = surface)
    depths:
      2cm: 'SWC_1_2_1'   # Surface BC - this will be used for theta(z=0,t)
      15cm: 'SWC_1_1_1'  # Depth sensor 1
      30cm: 'SWC_2_1_1'  # Depth sensor 2
      40cm: 'SWC_2_2_1'  # Depth sensor 3
      60cm: 'SWC_2_3_1'  # Depth sensor 4
      # Note: US-Uaf data has 5 SWC sensors total

    # Water table depth (optional - for validation only)
    wtd: 'WTD_1_1_1'      # Water table depth column
    wtd_sign: -1.0         # Multiply by -1 to convert to positive downward

# ============================================================================
# SOIL PARAMETERS (van Genuchten-Mualem)
# ============================================================================
# NOTE: These are from Calhoun CCZO - you should update these for US-Uaf site!
soil:
  theta_s: 0.46    # Saturated water content [-] - UPDATE FOR US-UAF
  theta_r: 0.05   # Residual water content [-] - UPDATE FOR US-UAF
  alpha: 4       # 1/m (van Genuchten α) - UPDATE FOR US-UAF
  n: 1.45           # van Genuchten n (>1) - UPDATE FOR US-UAF
  Ks: 2.0e-5       # m/s (saturated conductivity) - UPDATE FOR US-UAF
  l: 0.50          # Mualem pore-connectivity parameter - UPDATE FOR US-UAF

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  n_epochs: 5000
  learning_rate: 1.0e-4
  device: 'auto'      # 'auto', 'cuda', or 'cpu'
  seed: 44

# ============================================================================
# NETWORK ARCHITECTURE
# ============================================================================
network:
  h_net:              # Pressure head network
    hidden_dim: 64
    num_layers: 4
  zb_net:             # Water table network
    hidden_dim: 32
    num_layers: 3

# ============================================================================
# CACHE POOL & BATCH SAMPLING (PDE Collocation)
# ============================================================================
sampling:
  cache_size: 10000           # Total candidate points in pool
  batch_size: 500            # Points sampled per iteration
  resample_freq: 10000          # Update residuals every N epochs
  boundary_ratio: 0.7         # Fraction of cache near boundaries (0-1)
  high_residual_ratio: 0.6    # Fraction of batch from high-residual regions (0-1)
  temperature: 0.3            # Softmax temperature (lower = more aggressive)

# ============================================================================
# BOUNDARY CONDITION SAMPLING (Gradient-Based)
# ============================================================================
boundary_sampling:
  batch_size_bc: 450          # Dedicated BC points per iteration
  interp_ratio: 0.30          # Fraction from gradient-interpolated points
  neighbor_ratio: 0.00        # Fraction from neighbors of high-gradient regions
  baseline_ratio: 0.70        # Fraction from uniform baseline
  neighbor_expansion: 0       # How many neighbors around high-gradient intervals
  gradient_threshold: 0.7     # Percentile for "high gradient" (0.7 = top 30%)
  power: 2.0                  # Gradient emphasis (>1 = more aggressive)

# ============================================================================
# OPTIMIZATION & WEIGHT MANAGEMENT
# ============================================================================
optimization:
  weight_update_freq: 10000000000  # Update weights every N epochs (1e10 = fixed)
  weight_lr: 0.1                   # Learning rate for weight updates
  use_initial_scales: true         # Use initial scale-based weights
  use_amp: false                   # Mixed precision training (faster, less memory)
  use_multi_gpu: true              # Use DataParallel if multiple GPUs available
  grad_accumulation_steps: 1       # Gradient accumulation for larger effective batch

# ============================================================================
# CHECKPOINTING
# ============================================================================
checkpointing:
  dir: 'checkpoints_train'
  freq: 10000                  # Save checkpoint every N epochs (null = no checkpointing)
  keep_last_n: 3              # Keep only last N checkpoints (null = keep all)

# ============================================================================
# PHYSICS PARAMETERS
# ============================================================================
physics:
  Sy: 0.3                     # Specific yield - UPDATE FOR US-UAF
  zr: 0.5                     # Root zone depth [m] - UPDATE FOR US-UAF
  L: 4.0                      # Characteristic length [m] - UPDATE FOR US-UAF
  S_max: 1.0e-7               # Maximum sink term [1/s] - UPDATE FOR US-UAF
  zb_initial: 6.1             # Initial water table depth [m] - UPDATE FOR US-UAF
  ic_type: 'obs'      # Initial condition type: 'obs', 'linear', 'hydrostatic'

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================
output:
  dir: 'outputs'
