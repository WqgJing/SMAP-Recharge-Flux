# ============================================================================
# FAST TEST CONFIGURATION - Quick prototyping
# ============================================================================
# Use this for fast iteration and debugging.
# Small cache, few epochs, frequent checkpoints.

data:
  path: 'data/2017_HalfHourly_UTC_ForestSite1.xlsx'
  start_date: '2017-05-19'
  end_date: '2017-05-21'  # Only 2 days for fast testing
  interpolate: true
  max_gap_hours: 6

soil:
  theta_s: 0.40
  theta_r: 0.01
  alpha: 3.4
  n: 1.7
  Ks: 1.0e-5
  l: 0.50

training:
  n_epochs: 10000        # 10k epochs for quick test
  learning_rate: 1.0e-3  # Higher LR for faster convergence
  device: 'auto'
  seed: 44

network:
  h_net:
    hidden_dim: 32       # Smaller network for speed
    num_layers: 3
  zb_net:
    hidden_dim: 16
    num_layers: 2

sampling:
  batch_size: 1000             # Points sampled per iteration (GPU-optimized: use 2000-10000+)
  boundary_ratio: 0.7          # Fraction near boundaries (0=surface, 1=water table)

boundary_sampling:
  batch_size_bc: 100
  interp_ratio: 0.30
  neighbor_ratio: 0.00
  baseline_ratio: 0.70
  neighbor_expansion: 0
  gradient_threshold: 0.7
  power: 2.0

optimization:
  weight_update_freq: 10000000000
  weight_lr: 0.1
  use_initial_scales: true
  use_amp: false
  use_multi_gpu: false   # Disable for small tests
  grad_accumulation_steps: 1

checkpointing:
  dir: 'checkpoints_test'
  freq: 1000             # Frequent checkpoints for debugging
  keep_last_n: 2

physics:
  Sy: 0.3
  zr: 0.5
  L: 4.0
  S_max: 1.0e-7
  zb_initial: 6.1

output:
  dir: 'outputs_test'
